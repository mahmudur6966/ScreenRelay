; ScreenRelay config
; ------------------------------
; Format v2. Videos live once in [Library]; each [MonitorN] section just
; points at a LibraryId, so the same video can be assigned to more than one
; monitor (e.g. two HDMI outputs mirroring the same loop) - just repeat the
; same LibraryId under both [MonitorN] sections. Edit this by hand or, much
; more easily, use the Settings window ("Save as Default" writes this file).
;
; [Library]
;   ItemN = <id>|<full path to video file>|<display name>
;
; [MonitorN]  (N must match the monitor number shown by running the app
;              with /list, e.g. ScreenRelay.exe /list)
;   LibraryId  = which [Library] entry to play here (0 or omitted = none)
;   Width/Height = optional custom resolution to force on that monitor (0 = leave as-is)
;   RefreshHz    = optional refresh rate in Hz (0 = leave as-is)
;   Rotation     = optional: 0, 90, 180 or 270 (-1 = leave as-is)
;   Loop         = 1 to loop playback forever (gapless-loop seek), 0 to play once
;   Mute         = 1 to play this output's audio silently, 0 for normal audio

[Library]
Item1=1|C:\Videos\file1.mp4|file1.mp4
Item2=2|C:\Videos\file2.mp4|file2.mp4

[Monitor2]
LibraryId=1
Width=1920
Height=1080
RefreshHz=60
Rotation=0
Loop=1
Mute=0

[Monitor3]
LibraryId=2
Width=1920
Height=1080
RefreshHz=60
Rotation=0
Loop=1
Mute=0
